name: HAEMUNGI Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  # A PR verification must never cancel the running main-branch deployment.
  # Cancel only outdated runs of the same PR or branch.
  group: haemungi-pages-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public website source
        uses: actions/checkout@v6

      - name: Verify website, languages, and analytics privacy
        run: |
          node verify-haemungi.mjs
          node verify-i18n.mjs
          node verify-analytics.mjs
          node verify-admin.mjs
          node verify-playground.mjs
          node verify-story-seo.mjs
          node verify-memorial.mjs
          node verify-temple.mjs
          node verify-christmas.mjs

      - name: Decode all eight Christmas WebP images (pixel-level QA)
        run: bash verify-christmas-decode.sh

      - name: Build warm JPEG variants from the 8 original Christmas paintings
        run: bash build-christmas-warm.sh

      - name: Probe live artwork integrity (PR diagnostic)
        if: github.event_name == 'pull_request'
        run: bash verify-christmas-live.sh

      - name: Test Chromium rendering of Christmas Village scenes (PR)
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 18763 --bind 127.0.0.1 --directory dist >/tmp/haemungi-warm-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          CHRISTMAS_TEST_URL=http://127.0.0.1:18763/christmas.html node verify-christmas-browser.mjs

      - name: Check optional Cloudflare deployment credentials
        id: cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$TOKEN" && -n "$ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not configured; source checks passed but deployment is skipped."
          fi

      - name: Deploy to existing Cloudflare Pages project
        if: github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=haemungi --branch=main

      - name: Verify published Christmas artwork integrity
        if: github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        run: bash verify-christmas-live.sh

      - name: Verify all 8 warm JPEG artwork files are live
        if: github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        run: bash verify-christmas-jpeg-live.sh

      - name: Test Chromium rendering of published Christmas Village scenes
        if: github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        run: node verify-christmas-browser.mjs
