name: HAEMUNGI Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read
  deployments: write

concurrency:
  # A PR verification must never cancel the running main-branch deployment.
  # Cancel only outdated runs of the same PR or branch.
  group: haemungi-pages-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public website source
        uses: actions/checkout@v6

      - name: Restore exact approved pet store film from lossless upload parts
        run: |
          cat media-source/memorial-store/entry-00.bin media-source/memorial-store/entry-01.bin > dist/memorial/store-entry.mp4
          echo '1d85d7a9e70ffe813b4c8c42f8ac8801d1ebd3f29b0d2cdf2cbcc4f34052c604  dist/memorial/store-entry.mp4' | sha256sum -c -

      - name: Verify website, languages, and analytics privacy
        run: |
          node verify-haemungi.mjs
          node verify-i18n.mjs
          node verify-analytics.mjs
          node verify-admin.mjs
          node verify-playground.mjs
          node verify-story-seo.mjs
          node verify-memorial.mjs
          node verify-memorial-registration.mjs
          node verify-memorial-entry-and-dates.cjs
          node verify-memorial-communal-elastic.mjs
          node verify-memorial-scale.cjs
          node verify-memorial-walk.mjs
          node verify-memorial-journey.mjs
          node verify-memorial-store.mjs
          node verify-memorial-communal.mjs
          node verify-temple.mjs
          node verify-christmas.mjs

      # Cache only derivatives keyed by all eight immutable WebP masters and the renderer.
      # Original artworks and the on-site warm colour treatment remain unchanged.
      - name: Reuse verified warm Christmas JPEG derivatives
        id: warm-jpeg-cache
        uses: actions/cache@v5
        with:
          path: dist/assets/christmas-*.jpg
          key: haemungi-warm-jpegs-v1-${{ hashFiles('dist/assets/christmas-*.webp', 'build-christmas-warm.sh', 'verify-christmas-decode.sh') }}

      - name: Decode all eight Christmas WebP images (pixel-level QA)
        if: steps.warm-jpeg-cache.outputs.cache-hit != 'true'
        run: bash verify-christmas-decode.sh

      - name: Build warm JPEG variants from the 8 original Christmas paintings
        if: steps.warm-jpeg-cache.outputs.cache-hit != 'true'
        run: bash build-christmas-warm.sh

      - name: Check the eight original-composition JPEGs are ready to deploy
        run: |
          test "$(find dist/assets -maxdepth 1 -type f -name 'christmas-*.jpg' | wc -l)" -eq 8
          for jpg in dist/assets/christmas-*.jpg; do test -s "$jpg"; done

      # Successful browser QA is content-addressed. Any change to the scene,
      # painting or test automatically invalidates the cached pass marker.
      - name: Reuse an unchanged Christmas scene browser QA pass
        id: christmas-qa-cache
        uses: actions/cache@v5
        with:
          path: .ci-cache/christmas-browser-pass
          key: haemungi-christmas-qa-v1-${{ hashFiles('dist/christmas.html', 'dist/christmas.js', 'dist/christmas.css', 'dist/assets/christmas-*.webp', 'build-christmas-warm.sh', 'verify-christmas-browser.mjs') }}

      - name: Probe live artwork integrity (PR diagnostic)
        if: github.event_name == 'pull_request'
        run: bash verify-christmas-live.sh

      - name: Test Chromium rendering of Christmas Village scenes (PR)
        if: github.event_name == 'pull_request' && steps.christmas-qa-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m http.server 18763 --bind 127.0.0.1 --directory dist >/tmp/haemungi-warm-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          CHRISTMAS_TEST_URL=http://127.0.0.1:18763/christmas.html node verify-christmas-browser.mjs

      - name: Check optional Cloudflare deployment credentials
        id: cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$TOKEN" && -n "$ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not configured; source checks passed but deployment is skipped."
          fi

      - name: Deploy to existing Cloudflare Pages project
        if: github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=haemungi --branch=main

      - name: Verify published Christmas artwork integrity
        if: github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        run: bash verify-christmas-live.sh

      - name: Verify all 8 warm JPEG artwork files are live
        if: github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        run: bash verify-christmas-jpeg-live.sh

      - name: Test Chromium rendering of published Christmas Village scenes
        if: github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true' && steps.christmas-qa-cache.outputs.cache-hit != 'true'
        run: node verify-christmas-browser.mjs

      - name: Remember successful Christmas browser QA for unchanged scene assets
        if: success() && steps.christmas-qa-cache.outputs.cache-hit != 'true' && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'))
        run: |
          mkdir -p .ci-cache
          printf 'Christmas real Chromium scene QA passed for this source hash.\n' > .ci-cache/christmas-browser-pass
